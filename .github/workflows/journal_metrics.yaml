name: Update annual journal metrics

on:
  workflow_dispatch:
  schedule:
    # July 3 and 17, 16:37 Asia/Shanghai. The second run catches late publisher updates.
    - cron: '37 8 3,17 7 *'
  push:
    branches: [main]
    paths:
      - 'journal_metrics/update_journal_metrics.py'
      - '.github/workflows/journal_metrics.yaml'

permissions:
  contents: write

concurrency:
  group: academic-profile-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Open existing metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          if gh api "repos/$GH_REPO/git/ref/heads/google-scholar-stats" >/dev/null 2>&1; then
            git clone --single-branch --branch google-scholar-stats "https://github.com/$GH_REPO.git" stats
          else
            mkdir stats
            git -C stats init --initial-branch=google-scholar-stats
            git -C stats remote add origin "https://github.com/$GH_REPO.git"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve publisher metrics
        run: python source/journal_metrics/update_journal_metrics.py --seed source/assets/journal-metrics.json --output stats/journal_metrics.json
      - name: Publish verified metrics
        working-directory: stats
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update annual journal impact factors'
          git push origin HEAD:google-scholar-stats
